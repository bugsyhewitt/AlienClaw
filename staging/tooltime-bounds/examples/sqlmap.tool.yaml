# PROPOSAL EXAMPLE (staged in AlienClaw, not in ToolTime).
# Base: ~/dev/tooltime agents/agent-19/tools/sqlmap/pho3nix_config/tool.yaml (untracked: agents/*/tools/
# is gitignored), read 2026-11-26, sha256 174f97edf1c6bec4...,
# with `bounds:` added under level and risk, and two NEW params (threads, delay).
# Bounds from AlienClaw pho3nix_tuner/tooltime_bounds.py (sqlmap level/risk/threads/delay),
# all DOCUMENTED ONLY there, so evolvable is false: Pho3nix's rebuild_command_with_params
# does not apply any sqlmap param. This example shows the non-evolvable path.

# pho3nix_config/tool.yaml
# Packet-31 blessed input contract for add_tool.py.

name: sqlmap
safe_name: sqlmap
registry_name: sqlmap
version: "1.10.7"
description: |
  Automatic SQL injection and database takeover tool.

# --- Pho3nix wiring -------------------------------------------------------
pho3nix_category: database
tier: research
rest_route: /api/tools/sqlmap/run

# --- enforcement axes (executor checks these before execute()) ------------
blast_radius: destructive
scope_aware: true
read_only: false
timeout_s: 180

# --- modality / environment -----------------------------------------------
modality: cli
hardware_required: none
privilege: user
lifecycle: single-shot
os: linux
external_requirements: none
output_type: text

# --- invocation -----------------------------------------------------------
cli_binary: sqlmap
cli_template: "sqlmap -u {target} --batch --level {level} --risk {risk}"
params:
  target:
    required: true
    type: string
    description: "Target URL"
  level:
    required: true
    type: string
    description: "Scan level 1-5 (default: 1)"
    bounds:                                   # NEW (proposal)
      min: 1
      max: 3
      step: 1
      unit: level
      value_template: "{value}"               # the param is typed string in the catalog
      direction: increases_aggressiveness
      evolvable: false
      rationale: "Pho3nix optimization_profiles: stealth=1, normal=2, aggressive=3. Levels 4-5 excluded."
      source: "pho3nix server_core/parameter_optimizer.py optimization_profiles.sqlmap"
  risk:
    required: true
    type: string
    description: "Risk level 1-3 (default: 1)"
    bounds:                                   # NEW (proposal)
      min: 1
      max: 3
      step: 1
      unit: risk
      value_template: "{value}"
      direction: increases_aggressiveness
      evolvable: false
      rationale: "Pho3nix optimization_profiles: stealth=1, normal=2, aggressive=3 (the full sqlmap range)."
      source: "pho3nix server_core/parameter_optimizer.py optimization_profiles.sqlmap"
  threads:                                    # NEW (proposal)
    required: false
    type: integer
    default: 1
    flag: --threads
    minimum: 1
    maximum: 10                               # sqlmap lib/core/settings.py MAX_NUMBER_OF_THREADS
    description: "Max number of concurrent HTTP requests (sqlmap default 1, hard cap 10)."
    bounds:
      min: 1
      max: 10
      step: 1
      unit: threads
      direction: increases_aggressiveness
      evolvable: false
      rationale: "Pho3nix optimization_profiles: stealth=1, normal=5, aggressive=10."
      source: "pho3nix server_core/parameter_optimizer.py optimization_profiles.sqlmap"
  delay:                                      # NEW (proposal)
    required: false
    type: number
    default: 0
    flag: --delay
    minimum: 0
    description: "Delay in seconds between each HTTP request (sqlmap default 0)."
    bounds:
      min: 0
      max: 5
      step: 1
      unit: s
      direction: decreases_aggressiveness
      evolvable: false
      rationale: "Pho3nix optimization_profiles: stealth=1, normal=0, aggressive=0; ceiling 5 s from tooltime_bounds.py."
      source: "pho3nix server_core/parameter_optimizer.py optimization_profiles.sqlmap"

# --- lifecycle / state ----------------------------------------------------
classification: STANDARD_AND_RESEARCH
classification_source: reviewer_manual
disabled: false
disabled_reason: ""

# --- upstream reference ---------------------------------------------------
upstream_url: https://sqlmap.org

saas_shippable: true
path_a_rich_schema: false
